<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Login | Jai Haryana Cargo Mover
    </title>

    <link
        rel="stylesheet"
        href="../css/login.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>

    <!-- =====================================================
         LOGIN PAGE
    ====================================================== -->

    <main class="login-page">


        <!-- ================= HEADER ================= -->

        <header class="login-header">

            <div class="header-line"></div>

            <div class="header-title">

                <span>
                    LOGIN TO
                </span>

                <strong>
                    JAI HARYANA CARGO MOVER
                </strong>

            </div>

            <div class="header-line"></div>

        </header>


        <!-- ================= LOGIN CARD ================= -->

        <section class="login-card">


            <!-- LOGO -->

            <div class="login-logo">

                <img
                    src="../assats/logo/logo.png"
                    alt="Jai Haryana Cargo Mover">

            </div>


            <div class="login-welcome">

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Sign in to access your transport dashboard
                </p>

            </div>


            <!-- ================= FORM ================= -->

            <form id="loginForm" novalidate>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">

                        <i class="fa-solid fa-phone"></i>

                        Mobile Number

                    </label>


                    <div class="phone-wrapper">


                        <!-- COUNTRY CODE -->

                        <select
                            id="countryCode"
                            name="countryCode"
                            aria-label="Country code">

                            <option value="+91">
                                +91
                            </option>

                            <option value="+1">
                                +1
                            </option>

                            <option value="+44">
                                +44
                            </option>

                            <option value="+971">
                                +971
                            </option>

                        </select>


                        <!-- PHONE -->

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter 10 digit mobile number"
                            maxlength="10"
                            inputmode="numeric"
                            autocomplete="tel"
                            required>

                    </div>


                    <small
                        class="field-error"
                        id="phoneError">
                    </small>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">

                        <i class="fa-solid fa-lock"></i>

                        Password

                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>


                        <button
                            type="button"
                            id="togglePassword"
                            aria-label="Show password">

                            <i
                                class="fa-solid fa-eye">
                            </i>

                        </button>

                    </div>


                    <small
                        class="field-error"
                        id="passwordError">
                    </small>

                </div>


                <!-- REMEMBER -->

                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="rememberMe">

                        <span>
                            Remember me
                        </span>

                    </label>


                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <!-- ERROR -->

                <div
                    id="loginMessage"
                    class="login-message">
                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    id="loginBtn"
                    class="login-btn">

                    <span id="loginBtnText">

                        Login

                    </span>

                    <i
                        id="loginLoader"
                        class="fa-solid fa-spinner fa-spin">
                    </i>

                </button>


            </form>


            <!-- FOOTER -->

            <div class="login-footer">

                <span>
                    © 2026 Jai Haryana Cargo Mover
                </span>

            </div>

        </section>

    </main>


    <script src="js/login.js"></script>

</body>

</html>
