<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Settings</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Sidebar with id + active link -->
  <div class="sidebar" id="sidebar">
    <h2>settings</h2>
    <a href="Dashboard.html">🏠 Dashboard</a>
    <a href="users.html">👥 Users</a>
    <a href="notify.html">📣 Notify</a>
    <a href="project.html">🏗️ Projects</a>
    <a href="approvals.html">📝 Approvals</a>
    <a href="reports.html">📊 Reports</a>
    <a href="settings.html" class="active">⚙️ Settings</a>
    <a href="login.html">🚪 Logout</a>
  </div>

  <!-- Main content with id="content" -->
  <div class="dashboard-content" id="content">
    <div class="dashboard-header">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <h1>⚙️ Admin Settings</h1>
    </div>

    <div class="settings-box">
      <form id="settingsForm">
        <label for="name">👤 Name</label>
        <input type="text" id="name" value="Admin User" required />

        <label for="email">📧 Email</label>
        <input type="email" id="email" value="admin@example.com" required />

        <label for="password">🔒 New Password</label>
        <input type="password" id="password" placeholder="Enter new password" />

        <button type="submit" class="btn-save">Save Changes</button>
        <button type="button" class="btn-logout" onclick="window.location.href='login.html'">Logout</button>
      </form>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
