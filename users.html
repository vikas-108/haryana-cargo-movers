 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>All Users</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="sidebar" id="sidebar">
    <h2>User</h2>
    <a href="Dashboard.html">🏠 Dashboard</a>
    <a href="users.html" class="active">👥 Users</a>
    <!--<a href="notify.html">📣 Notify</a>-->
    <a href="project.html">🏗️ Projects</a>
    <a href="approvals.html">📝 Approvals</a>
     <a href="reports.html">📊 Reports</a>
   <!-- <a href="settings.html">⚙️ Settings</a> -->
    <a href="login.html">🚪 Logout</a>
  </div>

<div class="dashboard-content" id="content">
  <!-- Header -->
  <div class="dashboard-header">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <div>
      <h1>👥 Users</h1>
      <p class="page-subtitle">Manage clients and contractors</p>
    </div>
  </div>

  <!-- Filters -->
  <div class="users-toolbar">
    <input
      type="text"
      id="search"
      placeholder="Search by name or email"
      class="search-input"
    />

    <select id="roleFilter" class="filter-select">
      <option value="all">All Roles</option>
      <option value="client">Client</option>
      <option value="contractor">Contractor</option>
    </select>
  </div>

  <!-- Table -->
  <div class="table-responsive">
    <table class="users-table">
      <thead>
        <tr>
          <th>User</th>
          <th>Email</th>
          <th>Role</th>
          <th>Status</th>
          <th style="text-align:right;">Actions</th>
        </tr>
      </thead>

      <tbody id="user-table-body">
        <tr data-role="client">
          <td class="user-cell">
            <div class="avatar">R</div>
            <span>Rahul Mehta</span>
          </td>
          <td>rahul@gmail.com</td>
          <td><span class="role-badge client">Client</span></td>
          <td><span class="status-badge active">Active</span></td>
          <td class="actions">
            <button class="btn-view">View</button>
            <button class="btn-block">Block</button>
            <button class="btn-delete">Delete</button>
          </td>
        </tr>

        <tr data-role="contractor">
          <td class="user-cell">
            <div class="avatar contractor">A</div>
            <span>Aman Verma</span>
          </td>
          <td>aman@buildpro.com</td>
          <td><span class="role-badge contractor">Contractor</span></td>
          <td><span class="status-badge pending">Pending</span></td>
          <td class="actions">
            <button class="btn-view">View</button>
            <button class="btn-block">Block</button>
            <button class="btn-delete">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  const searchInput = document.getElementById("search");
  const roleFilter = document.getElementById("roleFilter");
  const rows = document.querySelectorAll("#user-table-body tr");

  function filterUsers() {
    const search = searchInput.value.toLowerCase();
    const role = roleFilter.value;

    rows.forEach(row => {
      const name = row.innerText.toLowerCase();
      const rowRole = row.dataset.role;

      const matchSearch = name.includes(search);
      const matchRole = role === "all" || rowRole === role;

      row.style.display = matchSearch && matchRole ? "" : "none";
    });
  }

  searchInput.addEventListener("input", filterUsers);
  roleFilter.addEventListener("change", filterUsers);
</script>

<script src="js/script.js"></script>
</body>
</html>
